name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test, lint and build APK
        run: bash ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon
      - name: Prepare download
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/ToneKeep-preview.apk
          cd dist
          sha256sum ToneKeep-preview.apk > SHA256SUMS.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ToneKeep-apk-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ToneKeep-apk-${{ github.run_number }}
          path: dist
      - name: Publish downloadable APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_ATTEMPT: ${{ github.run_attempt }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          cat > notes.md <<'NOTES'
          Android 10以降に対応した検証版です。

          Assetsの **ToneKeep-preview.apk** をAndroid端末でダウンロードして開いてください。
          曲名検索 → 音源を選ぶ → 形式・容量を確認 → ダウンロード、の順に使えます。
          保存先は「ダウンロード / ToneKeep」です。

          Internet ArchiveのCC・パブリックドメイン表記のある音源を対象としています。
          音質は元ファイルが上限です。各音源のライセンス条件に従って利用してください。
          このAPKは公開テスト鍵で署名した検証版です。
          NOTES
          gh release create "preview-${BUILD_NUMBER}-${BUILD_ATTEMPT}" dist/* \
            --repo "$GH_REPO" --target "$COMMIT_SHA" \
            --title "ToneKeep Preview #${BUILD_NUMBER}" --prerelease --notes-file notes.md
