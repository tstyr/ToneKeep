name: Android APK

on:
  push:
    branches: [main, feature/offline-ai-lyrics]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '12266719'
          log-accepted-android-sdk-licenses: false
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Keep the offline preview application ID
        if: github.ref == 'refs/heads/feature/offline-ai-lyrics'
        run: echo 'ORG_GRADLE_PROJECT_offlineVerification=true' >> "$GITHUB_ENV"
      - name: Test, lint and build APK
        run: bash ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon
      - name: Install FFmpeg for integration check
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
      - name: Check bundled yt-dlp and audio extraction
        run: python3 scripts/smoke_ytdlp.py
      - name: Check pitch, tempo and output quality
        run: python3 scripts/smoke_pitch.py
      - name: Prepare download
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/ToneKeep-preview.apk
          cd dist
          sha256sum ToneKeep-preview.apk > SHA256SUMS.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ToneKeep-apk-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html

  android-device:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Reserve space for Android device
        run: |
          sudo rm -rf -- /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '12266719'
          log-accepted-android-sdk-licenses: false
      - name: Enable Android acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Keep the offline preview application ID
        if: github.ref == 'refs/heads/feature/offline-ai-lyrics'
        run: echo 'ORG_GRADLE_PROJECT_offlineVerification=true' >> "$GITHUB_ENV"
      - name: Fetch verified model for offline JNI smoke test (test APK only)
        run: python3 scripts/fetch_lyrics_test_model.py
      - name: Install native build tools for device tests
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Test packaged Android audio engine and capture screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disk-size: 4096M
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 2048 -partition-size 4096 -no-metrics
          script: bash .ci/android_device.sh
      - name: Upload Android evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-verification
          path: |
            device-verification/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/

  publish:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/offline-ai-lyrics')
    needs: [build, android-device]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ToneKeep-apk-${{ github.run_number }}
          path: dist
      - name: Publish downloadable APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_ATTEMPT: ${{ github.run_attempt }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          cat > notes.md <<'NOTES'
          Android 10以降に対応した検証版です。

          Assetsの **ToneKeep-preview.apk** をAndroid端末でダウンロードして開いてください。
          曲名検索 → 音源を選ぶ → 形式・容量を確認 → ダウンロード、の順に使えます。
          保存先は「ダウンロード / ToneKeep」です。
          一括保存は「プレイリストURLを入力 → プレイリスト → 全選択 → 保存」です。
          グループごとの一括中止・失敗した曲だけの再試行に対応します。
          「キー変更」で端末の音声ファイル、または保存済みの音源を選ぶと、テンポを保って−12〜＋12半音へ変更できます。
          ボーカルと伴奏をまとめて処理し、原本を残してFLAC／WAV（24bit）、MP3、M4A/AAC、Opus、Ogg/Vorbisで保存します。
          1.5版では保存前の20秒試聴と、再生・一時停止・シークができるアプリ内プレーヤーを追加しました。試聴中にキーや声質を変更でき、曲の好きな位置を選べます。

          曲名検索はYouTube / SoundCloud、URL入力はyt-dlpの対応サイトに対応します。
          元の音声形式を優先します。音質は配信元の音源が上限です。
          保存・利用する権利のあるコンテンツに使用してください。
          Spotify音源の直接保存・Spotifyプレイリストの取り込みは非対応です。
          yt-dlp・FFmpeg・QuickJSを同梱しているためAPKの容量が大きくなっています。
          このAPKは公開テスト鍵で署名した検証版です。
          歌詞の取得・行/単語のなぞり同期・端末内AI照合、再生通知とバックグラウンド再生を追加しています。
          歌詞・曲情報取得の待機と再試行、アルバムの表示更新を修正しました。画像が取れない場合も曲情報は保存します。
          取得先の停止・混雑（HTTP 503等）は取得元名と理由を表示します。サービス停止中は取得できない場合があります。
          Galaxy / Android 17での通知の外観、画面消灯中の再生と省電力設定の影響は未検証です。
          feature/offline-ai-lyrics版のアプリIDは jp.tonekeep.app.offlineverify です。
          AI歌詞は実験機能です。モデルは別途取得し、以後の解析は端末内で行います。歌唱の誤認識・同期ずれがあり、強制アライメントとボーカル分離は未実装です。
          NOTES
          gh release create "preview-${BUILD_NUMBER}-${BUILD_ATTEMPT}" dist/* \
            --repo "$GH_REPO" --target "$COMMIT_SHA" \
            --title "ToneKeep Preview #${BUILD_NUMBER}" --prerelease --notes-file notes.md
