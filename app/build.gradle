plugins { id 'com.android.application' }

android {
    namespace 'jp.tonekeep.app'
    compileSdk 35
    defaultConfig {
        applicationId 'jp.tonekeep.app'
        minSdk 29
        targetSdk 35
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName '1.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        preview {
            storeFile rootProject.file('.ci/preview.keystore')
            storePassword 'android'
            keyAlias 'tonekeep-preview'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-preview'
            signingConfig signingConfigs.preview
        }
        release { minifyEnabled false }
    }
    lint { abortOnError true }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
