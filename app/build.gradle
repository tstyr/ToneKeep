plugins { id 'com.android.application' }

android {
    namespace 'jp.tonekeep.app'
    compileSdk 35
    defaultConfig {
        applicationId 'jp.tonekeep.app'
        minSdk 29
        targetSdk 35
        versionCode 400 + Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName '1.4.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        preview {
            storeFile rootProject.file('.ci/preview.keystore')
            storePassword 'android'
            keyAlias 'tonekeep-preview'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-preview'
            signingConfig signingConfigs.preview
        }
        release { minifyEnabled false }
    }
    lint { abortOnError true }
    testOptions { unitTests { includeAndroidResources = true; all { maxHeapSize = '1024m' } } }
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
            keepDebugSymbols += ['**/libpython.zip.so', '**/libffmpeg.zip.so']
        }
    }
}

dependencies {
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
